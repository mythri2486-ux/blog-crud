<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog CRUD Application</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        h2 {
            color: #333;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
        }

        button:hover {
            opacity: 0.85;
        }

        .save-btn {
            background: #007bff;
            color: white;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
        }

        .edit-btn {
            background: #ffc107;
            color: #222;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            min-height: 20px;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .blog {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .blog h3 {
            margin-top: 0;
            color: #222;
        }

        .category {
            color: #007bff;
            font-weight: bold;
        }

        .date {
            color: #777;
            font-size: 13px;
        }

        .no-blogs {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📝 Blog CRUD Application</h1>

        <!-- CREATE / UPDATE FORM -->

        <div class="form-box">

            <h2 id="formTitle">Create Blog</h2>

            <input type="hidden" id="blogId">

            <label>Title</label>
            <input
                type="text"
                id="title"
                placeholder="Enter blog title"
            >

            <label>Content</label>
            <textarea
                id="content"
                placeholder="Enter blog content"
            ></textarea>

            <label>Author</label>
            <input
                type="text"
                id="author"
                placeholder="Enter author name"
            >

            <label>Category</label>
            <select id="category">

                <option value="Technology">
                    Technology
                </option>

                <option value="AIML">
                    AIML
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="General">
                    General
                </option>

            </select>

            <button
                class="save-btn"
                onclick="saveBlog()">
                Save Blog
            </button>

            <button
                class="cancel-btn"
                onclick="resetForm()">
                Cancel
            </button>

        </div>


        <!-- MESSAGE -->

        <p id="message"></p>


        <!-- SEARCH AND FILTER -->

        <div class="search-box">

            <h2>Search & Filter Blogs</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search by title, content or author..."
                onkeyup="filterBlogs()"
            >

            <select
                id="categoryFilter"
                onchange="filterBlogs()"
            >

                <option value="All">
                    All Categories
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="AIML">
                    AIML
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="General">
                    General
                </option>

            </select>

        </div>


        <!-- BLOG LIST -->

        <h2>All Blogs</h2>

        <div id="blogs"></div>

    </div>


    <script>

        // Backend API URL

        const API_URL =
            "http://127.0.0.1:5001/api/blogs";


        // Store blogs in memory

        let allBlogs = [];


        // =====================================
        // LOAD BLOGS
        // =====================================

        async function loadBlogs() {

            try {

                const response =
                    await fetch(API_URL);

                if (!response.ok) {

                    throw new Error(
                        "Failed to load blogs"
                    );

                }

                allBlogs =
                    await response.json();

                displayBlogs(allBlogs);

            } catch (error) {

                console.error(error);

                showMessage(
                    "❌ Error loading blogs"
                );

            }

        }


        // =====================================
        // DISPLAY BLOGS
        // =====================================

        function displayBlogs(blogs) {

            const blogsContainer =
                document.getElementById("blogs");

            blogsContainer.innerHTML = "";


            if (blogs.length === 0) {

                blogsContainer.innerHTML =
                    `<p class="no-blogs">
                        No blogs found.
                    </p>`;

                return;
            }


            blogs.forEach(blog => {

                const blogDiv =
                    document.createElement("div");

                blogDiv.className = "blog";


                const date =
                    blog.createdAt
                        ? new Date(blog.createdAt)
                            .toLocaleString()
                        : "";


                blogDiv.innerHTML = `

                    <h3>${escapeHTML(blog.title)}</h3>

                    <p>
                        ${escapeHTML(blog.content)}
                    </p>

                    <p>
                        <strong>Author:</strong>
                        ${escapeHTML(blog.author)}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        <span class="category">
                            ${escapeHTML(blog.category || "General")}
                        </span>
                    </p>

                    <p class="date">
                        Created: ${date}
                    </p>

                    <button
                        class="edit-btn"
                        onclick="editBlog('${blog._id}')">
                        ✏️ Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteBlog('${blog._id}')">
                        🗑️ Delete
                    </button>

                `;

                blogsContainer.appendChild(blogDiv);

            });

        }


        // =====================================
        // CREATE / UPDATE BLOG
        // =====================================

        async function saveBlog() {

            const id =
                document.getElementById("blogId").value;

            const title =
                document.getElementById("title").value.trim();

            const content =
                document.getElementById("content").value.trim();

            const author =
                document.getElementById("author").value.trim();

            const category =
                document.getElementById("category").value;


            // Validation

            if (!title || !content || !author) {

                showMessage(
                    "⚠️ Please fill all required fields"
                );

                return;
            }


            const blogData = {

                title: title,

                content: content,

                author: author,

                category: category

            };


            try {

                let response;


                // UPDATE

                if (id) {

                    response =
                        await fetch(
                            `${API_URL}/${id}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(blogData)
                            }
                        );

                }

                // CREATE

                else {

                    response =
                        await fetch(
                            API_URL,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(blogData)
                            }
                        );

                }


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Operation failed"
                    );

                }


                showMessage(
                    "✅ " + data.message
                );


                resetForm();

                await loadBlogs();


            } catch (error) {

                console.error(error);

                showMessage(
                    "❌ " + error.message
                );

            }

        }


        // =====================================
        // EDIT BLOG
        // =====================================

        async function editBlog(id) {

            try {

                const response =
                    await fetch(
                        `${API_URL}/${id}`
                    );


                const blog =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        blog.message ||
                        "Blog not found"
                    );

                }


                document.getElementById(
                    "blogId"
                ).value = blog._id;


                document.getElementById(
                    "title"
                ).value = blog.title;


                document.getElementById(
                    "content"
                ).value = blog.content;


                document.getElementById(
                    "author"
                ).value = blog.author;


                document.getElementById(
                    "category"
                ).value =
                    blog.category || "General";


                document.getElementById(
                    "formTitle"
                ).innerText =
                    "Update Blog";


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });


            } catch (error) {

                console.error(error);

                showMessage(
                    "❌ Error loading blog"
                );

            }

        }


        // =====================================
        // DELETE BLOG
        // =====================================

        async function deleteBlog(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this blog?"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Delete failed"
                    );

                }


                showMessage(
                    "✅ " + data.message
                );


                await loadBlogs();


            } catch (error) {

                console.error(error);

                showMessage(
                    "❌ " + error.message
                );

            }

        }


        // =====================================
        // SEARCH + CATEGORY FILTER
        // =====================================

        function filterBlogs() {

            const searchText =
                document.getElementById(
                    "searchInput"
                ).value
                .toLowerCase()
                .trim();


            const selectedCategory =
                document.getElementById(
                    "categoryFilter"
                ).value;


            const filteredBlogs =
                allBlogs.filter(blog => {

                    const title =
                        (blog.title || "")
                        .toLowerCase();

                    const content =
                        (blog.content || "")
                        .toLowerCase();

                    const author =
                        (blog.author || "")
                        .toLowerCase();

                    const category =
                        blog.category ||
                        "General";


                    const matchesSearch =
                        title.includes(searchText) ||
                        content.includes(searchText) ||
                        author.includes(searchText);


                    const matchesCategory =
                        selectedCategory === "All" ||
                        category === selectedCategory;


                    return (
                        matchesSearch &&
                        matchesCategory
                    );

                });


            displayBlogs(filteredBlogs);

        }


        // =====================================
        // RESET FORM
        // =====================================

        function resetForm() {

            document.getElementById(
                "blogId"
            ).value = "";


            document.getElementById(
                "title"
            ).value = "";


            document.getElementById(
                "content"
            ).value = "";


            document.getElementById(
                "author"
            ).value = "";


            document.getElementById(
                "category"
            ).value = "Technology";


            document.getElementById(
                "formTitle"
            ).innerText =
                "Create Blog";

        }


        // =====================================
        // MESSAGE
        // =====================================

        function showMessage(message) {

            const messageBox =
                document.getElementById(
                    "message"
                );


            messageBox.innerText =
                message;


            setTimeout(() => {

                messageBox.innerText = "";

            }, 3000);

        }


        // =====================================
        // SECURITY HELPER
        // =====================================

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text || "";

            return div.innerHTML;

        }


        // =====================================
        // LOAD BLOGS ON PAGE LOAD
        // =====================================

        loadBlogs();

    </script>

</body>

</html>
